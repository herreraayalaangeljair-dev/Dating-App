<div class="flex justify-center items-center w-full mt-9 px-4 ">
    <div class="card w-full max-w-md bg-base-200 shadow-2xl border border-base-300">
        <div class="card-body p-4">
            <h2 class="card-title text-base-content mb-2 text-lg">Dating App</h2>
            <ul class="divide-y divide-base-300">
                @for (member of members(); track member.id) {
                <li class="py-3 flex items-center gap-4 hover:bg-base-300/50 px-3 rounded-lg transition-colors">
                    <!-- Avatar con DaisyUI -->
                    <div class="avatar">
                        <div class="w-12 h-12 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
                            <img src="perro.jpg" alt="Avatar de {{ member.userName }}" />
                        </div>
                    </div>
                    <!-- Nombre del miembro -->
                    <span class="font-medium text-base-content">{{ member.userName }}</span>
                </li>
                }
            </ul>
        </div>
    </div>
</div>
